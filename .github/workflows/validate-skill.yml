name: Validate skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate structure and references
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n install/install.sh
          bash -n install/uninstall.sh
          bash -n install/validate.sh

      - name: Validate skill
        run: ./install/validate.sh
